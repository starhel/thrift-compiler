name: Build

on: [push, pull_request]

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: ./dist/*.tar.gz

  build_wheels:
    name: Build ${{ matrix.build }}${{ matrix.arch }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: "x86_64"
            build: "manylinux_"
          - os: ubuntu-latest
            arch: "x86_64"
            build: "musllinux_"
          - os: ubuntu-latest
            arch: "i686"
            build: "manylinux_"
          - os: ubuntu-latest
            arch: "i686"
            build: "musllinux_"
          - os: windows-2019
            arch: "AMD64"
            build: ""
          - os: windows-2019
            arch: "x86"
            build: ""
          - os: macos-13  # macOS / Intel
            arch: "x86_64"
            build: ""
          - os: macos-14  # macOS / Apple Silicon
            arch: "arm64"
            build: ""

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: "${{ matrix.arch }}"
          CIBW_BUILD: "cp313-${{ matrix.build }}*"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.os }}-${{ matrix.build }}${{ matrix.arch }}
          path: ./wheelhouse/*.whl