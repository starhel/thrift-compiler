name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]

    steps:
      - uses: actions/checkout@v4

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.21.3

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp311-macosx_x86_64,cp311-macosx_arm64,cp311-win_amd64,cp311-manylinux_x86_64,cp311-musllinux_x86_64
          CIBW_TEST_REQUIRES: tox
          CIBW_TEST_COMMAND: "tox -c {project}/tox.ini -e py3 --installpkg {wheel}"
          CIBW_ENVIRONMENT: ACLOCAL_PATH="/usr/share/aclocal"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL_MACOS: brew install autoconf automake libtool bison

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl