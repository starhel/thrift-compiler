name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build ${{ matrix.build }}${{ matrix.arch }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: "x86_64"
            build: "manylinux_"
          - os: ubuntu-latest
            arch: "x86_64"
            build: "musllinux_"
          - os: ubuntu-latest
            arch: "i686"
            build: "manylinux_"
          - os: ubuntu-latest
            arch: "i686"
            build: "musllinux_"
          - os: ubuntu-latest
            arch: "aarch64"
            build: "manylinux_"
          - os: ubuntu-latest
            arch: "aarch64"
            build: "musllinux_"
          - os: ubuntu-latest
            arch: "ppc64le"
            build: "manylinux_"
          - os: ubuntu-latest
            arch: "ppc64le"
            build: "musllinux_"
          - os: ubuntu-latest
            arch: "s390x"
            build: "manylinux_"
          - os: ubuntu-latest
            arch: "s390x"
            build: "musllinux_"
          - os: ubuntu-latest
            arch: "armv7l"
            build: "musllinux_"
          - os: windows-2019
            arch: "AMD64"
            build: ""
          - os: windows-2019
            arch: "x86"
            build: ""
          - os: macos-13  # macOS / Intel
            arch: "x86_64"
            build: ""
          - os: macos-14  # macOS / Apple Silicon
            arch: "arm64"
            build: ""

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: "${{ matrix.arch }}"
          CIBW_BUILD: "cp313-${{ matrix.build }}*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_REQUIRES: tox
          CIBW_TEST_COMMAND: "tox -c {project}/tox.ini -e py3 --installpkg {wheel}"
          CIBW_ENVIRONMENT_LINUX: ACLOCAL_PATH="/usr/share/aclocal"
          CIBW_ENVIRONMENT_MACOS: PATH="$(brew --prefix bison)/bin:$PATH" LDFLAGS="-L$(brew --prefix bison)/lib" CXXFLAGS="-Wno-inconsistent-missing-override"
          CIBW_BEFORE_ALL_MACOS: brew install autoconf automake libtool bison

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ runner.os }}-${{ matrix.build }}${{ matrix.arch }}
          path: ./wheelhouse/*.whl