name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

#      - name: Install packages
#        run: |
#          sudo apt-get update
#          sudo apt-get install

      - name: Build wheels
        run: /opt/python/cp312-cp312/bin/python -m build . --outdir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl